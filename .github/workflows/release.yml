name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "新增 Qwen3 / Qwen3-MoE 纯 JAX 实现：支持 safetensors 权重加载（分片、BF16）、Dense/MoE 前向、KV cache、文本生成与微调，以及与 HuggingFace 的数值对齐测试。"
