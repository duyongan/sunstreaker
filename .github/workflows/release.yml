name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Qwen3 / Qwen3-MoE 新增 LoRA 微调：冻结基础权重、只训练低秩适配器，支持 Dense 与逐专家 MoE 适配器，可通过 merge_lora 合并后正常推理与导出。"
